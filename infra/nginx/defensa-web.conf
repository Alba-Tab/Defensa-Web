log_format defensa_json escape=json '{'
  '"timestamp":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"request_method":"$request_method",'
  '"request_uri":"$request_uri",'
  '"status":$status,'
  '"limit_req_status":"$limit_req_status",'
  '"request_time":$request_time'
'}';

limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/defensa-access.json defensa_json;
    client_max_body_size 2m;
    limit_req_status 429;
    limit_req_log_level notice;

    # Solo un proxy local confiable puede sustituir la IP del cliente. Las
    # conexiones directas conservan su remote_addr y no pueden falsificar XFF.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /rest/user/login {
        limit_req zone=general burst=20 nodelay;
        limit_req zone=login burst=4 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
}
