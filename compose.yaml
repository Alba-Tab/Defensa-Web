services:
  servicio:
    build:
      context: ./servicio
    environment:
      DEFENSA_ENTORNO: desarrollo
      DEFENSA_MODO: simulado
      DEFENSA_DATABASE_URL: sqlite:////datos/defensa.db
      DEFENSA_LISTA_BLANCA: 127.0.0.0/8,::1/128
      DEFENSA_JWT_SECRET: ${DEFENSA_JWT_SECRET:-}
      DEFENSA_ADMIN_USUARIO: ${DEFENSA_ADMIN_USUARIO:-admin}
      DEFENSA_ADMIN_PASSWORD: ${DEFENSA_ADMIN_PASSWORD:-}
      DEFENSA_OLLAMA_URL: ${DEFENSA_OLLAMA_URL:-http://host.docker.internal:11434}
      DEFENSA_OLLAMA_MODELO: ${DEFENSA_OLLAMA_MODELO:-}
      DEFENSA_FCM_CREDENCIALES: ${DEFENSA_FCM_CREDENCIALES:-}
    ports:
      - "8000:8000"
    volumes:
      - defensa-datos:/datos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/salud')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  defensa-datos:
