services:
  gateway:
    build:
      context: .
      dockerfile: gateway.Dockerfile
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ../../infra/suricata/local.rules:/opt/pruebas/local.rules:ro
      - ./cola.nft:/opt/pruebas/cola.nft:ro
      - resultados-suricata:/var/log/suricata
    networks:
      atacante:
        ipv4_address: 172.30.10.2
      protegida:
        ipv4_address: 172.30.20.2

  app:
    build:
      context: .
      dockerfile: app.Dockerfile
    cap_add:
      - NET_ADMIN
    networks:
      protegida:
        ipv4_address: 172.30.20.10

  atacante:
    build:
      context: .
      dockerfile: atacante.Dockerfile
    cap_add:
      - NET_ADMIN
    volumes:
      - ../k6:/opt/pruebas/k6:ro
      - ../resultados:/opt/pruebas/resultados
    networks:
      atacante:
        ipv4_address: 172.30.10.10

networks:
  atacante:
    ipam:
      config:
        - subnet: 172.30.10.0/24
  protegida:
    ipam:
      config:
        - subnet: 172.30.20.0/24

volumes:
  resultados-suricata:
